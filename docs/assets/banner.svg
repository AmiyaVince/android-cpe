<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="android-cpe — turn a rooted Android phone into a 24x7 5G CPE">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#101c31"/>
      <stop offset="1" stop-color="#0c2a2b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#3ddc84"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="18" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- left: title -->
  <text x="72" y="92" fill="#7dd3fc" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600" letter-spacing="3.5">KERNELSU / MAGISK MODULES</text>

  <text x="70" y="158" fill="#ffffff" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="64" font-weight="800" letter-spacing="-1.5">android-cpe</text>

  <text x="72" y="200" fill="#e2e8f0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="500">Turn a rooted Android phone into a 24&#215;7 5G CPE.</text>
  <text x="72" y="230" fill="#94a3b8" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16">Ethernet tethering &#183; charge limiting &#183; SMS forwarding</text>

  <!-- pills -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600">
    <rect x="72" y="258" width="112" height="34" rx="17" fill="#3ddc84" fill-opacity="0.12" stroke="#3ddc84" stroke-opacity="0.45"/>
    <text x="128" y="280" fill="#7ee2ab" text-anchor="middle">cpe_net</text>

    <rect x="196" y="258" width="150" height="34" rx="17" fill="#38bdf8" fill-opacity="0.12" stroke="#38bdf8" stroke-opacity="0.45"/>
    <text x="271" y="280" fill="#8ed7fb" text-anchor="middle">cpe_control</text>

    <rect x="358" y="258" width="112" height="34" rx="17" fill="#a78bfa" fill-opacity="0.14" stroke="#a78bfa" stroke-opacity="0.5"/>
    <text x="414" y="280" fill="#c4b5fd" text-anchor="middle">cpe_sms</text>
  </g>

  <!-- right: phone with signal arcs -->
  <g filter="url(#glow)">
    <path d="M1020 150 A40 40 0 0 1 1100 150" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
    <path d="M1000 150 A60 60 0 0 1 1120 150" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" opacity="0.55"/>
    <path d="M980 150 A80 80 0 0 1 1140 150" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" opacity="0.3"/>
    <circle cx="1060" cy="152" r="4" fill="#3ddc84"/>
  </g>

  <g>
    <rect x="1016" y="176" width="88" height="118" rx="14" fill="#0f172a" stroke="#3ddc84" stroke-opacity="0.75" stroke-width="2.5"/>
    <rect x="1026" y="188" width="68" height="86" rx="8" fill="#3ddc84" fill-opacity="0.07"/>
    <path d="M1044 206h32M1044 220h32M1044 234h20" stroke="#3ddc84" stroke-opacity="0.6" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="1060" cy="284" r="3.5" fill="#3ddc84" fill-opacity="0.8"/>
  </g>
</svg>
