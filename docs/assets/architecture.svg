<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="android-cpe network topology">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#64748b"/>
    </marker>
    <style>
      .card   { fill:#ffffff; stroke:#cbd5e1; stroke-width:1.5; }
      .label  { font-family: ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill:#0f172a; }
      .muted  { font-family: ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill:#64748b; }
      .mono   { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill:#334155; }
      .wire   { stroke:#64748b; stroke-width:2; fill:none; }
    </style>
  </defs>

  <rect width="1200" height="620" rx="16" fill="#f8fafc"/>
  <rect x="0.5" y="0.5" width="1199" height="619" rx="16" fill="none" stroke="#e2e8f0"/>

  <!-- 5G -->
  <rect class="card" x="40" y="120" width="160" height="110" rx="12"/>
  <text class="label" x="120" y="166" font-size="20" font-weight="700" text-anchor="middle">5G NR</text>
  <text class="muted" x="120" y="192" font-size="14" text-anchor="middle">n78 / n41 &#183; CGNAT</text>
  <text class="muted" x="120" y="212" font-size="13" text-anchor="middle">rmnet_data*</text>

  <line class="wire" x1="200" y1="175" x2="244" y2="175" marker-end="url(#arrow)"/>

  <!-- phone -->
  <rect x="250" y="70" width="330" height="210" rx="14" fill="#ffffff" stroke="#3ddc84" stroke-width="2.5"/>
  <rect x="250" y="70" width="330" height="42" rx="14" fill="#3ddc84" fill-opacity="0.10"/>
  <path d="M250 112h330" stroke="#3ddc84" stroke-opacity="0.35" stroke-width="1.5"/>
  <text class="label" x="270" y="98" font-size="16" font-weight="700">Android phone &#8212; root</text>
  <text class="muted" x="562" y="98" font-size="12" text-anchor="end">ONLY DHCP / NAT</text>

  <g class="mono" font-size="14">
    <text x="272" y="146">rmnet_data*  &#8594;  5G uplink</text>
    <text x="272" y="174">iptables MASQUERADE + MSS clamp</text>
    <text x="272" y="202">dnsmasq  &#8594;  DHCP + DNS</text>
    <text x="272" y="230">eth0  &#8594;  USB NIC</text>
  </g>
  <text class="muted" x="272" y="260" font-size="12">eth0 also carries an ONT management alias</text>

  <line class="wire" x1="580" y1="175" x2="634" y2="175" marker-end="url(#arrow)"/>

  <!-- dock -->
  <rect class="card" x="640" y="120" width="150" height="110" rx="12"/>
  <text class="label" x="715" y="164" font-size="17" font-weight="700" text-anchor="middle">USB-C dock</text>
  <text class="muted" x="715" y="188" font-size="13" text-anchor="middle">RTL8153B</text>
  <text class="muted" x="715" y="208" font-size="13" text-anchor="middle">PD powered</text>

  <line class="wire" x1="790" y1="175" x2="839" y2="175" marker-end="url(#arrow)"/>

  <!-- fttr -->
  <rect class="card" x="845" y="90" width="210" height="170" rx="12"/>
  <text class="label" x="950" y="132" font-size="18" font-weight="700" text-anchor="middle">FTTR / ONT</text>
  <text class="muted" x="950" y="158" font-size="13" text-anchor="middle">DHCP off</text>
  <text class="muted" x="950" y="180" font-size="13" text-anchor="middle">L2 switch</text>
  <text class="muted" x="950" y="202" font-size="13" text-anchor="middle">+ Wi-Fi AP</text>
  <text class="muted" x="950" y="232" font-size="12" text-anchor="middle">no double NAT</text>

  <!-- bus to clients -->
  <path class="wire" d="M950 260V330H895M950 330H1005M950 330H1115"/>
  <path class="wire" d="M895 330V376" marker-end="url(#arrow)"/>
  <path class="wire" d="M1005 330V376" marker-end="url(#arrow)"/>
  <path class="wire" d="M1115 330V376" marker-end="url(#arrow)"/>

  <g>
    <rect class="card" x="845" y="382" width="100" height="76" rx="10"/>
    <text class="label" x="895" y="415" font-size="14" font-weight="600" text-anchor="middle">Laptop</text>
    <text class="muted" x="895" y="436" font-size="11" text-anchor="middle">DHCP</text>

    <rect class="card" x="955" y="382" width="100" height="76" rx="10"/>
    <text class="label" x="1005" y="415" font-size="14" font-weight="600" text-anchor="middle">TV / NAS</text>
    <text class="muted" x="1005" y="436" font-size="11" text-anchor="middle">DHCP</text>

    <rect class="card" x="1065" y="382" width="100" height="76" rx="10"/>
    <text class="label" x="1115" y="415" font-size="14" font-weight="600" text-anchor="middle">Wi-Fi clients</text>
    <text class="muted" x="1115" y="436" font-size="11" text-anchor="middle">DHCP</text>
  </g>

  <!-- module callouts -->
  <g>
    <rect x="40" y="470" width="1120" height="110" rx="12" fill="#ffffff" stroke="#e2e8f0"/>
    <text class="muted" x="64" y="496" font-size="12" font-weight="600" letter-spacing="2">MODULES</text>

    <circle cx="72" cy="522" r="5" fill="#3ddc84"/>
    <text class="label" x="88" y="527" font-size="15" font-weight="700">cpe_net</text>
    <text class="muted" x="88" y="548" font-size="13">starts ethernet tethering, 30 s watchdog</text>
    <text class="muted" x="88" y="566" font-size="13">recovers 28 s after reboot</text>

    <circle cx="430" cy="522" r="5" fill="#38bdf8"/>
    <text class="label" x="446" y="527" font-size="15" font-weight="700">cpe_control</text>
    <text class="muted" x="446" y="548" font-size="13">native 45 / 50 % charge cap</text>
    <text class="muted" x="446" y="566" font-size="13">60 s watchdog vs vendor write-back</text>

    <circle cx="810" cy="522" r="5" fill="#a78bfa"/>
    <text class="label" x="826" y="527" font-size="15" font-weight="700">cpe_sms</text>
    <text class="muted" x="826" y="548" font-size="13">inotifyd + incremental query &#8594; Bark</text>
    <text class="muted" x="826" y="566" font-size="13">4 MB RAM, ~1.5 s latency</text>
  </g>

  <!-- side note -->
  <text class="muted" x="64" y="612" font-size="12">Solid line = data path &#183; all clients obtain addresses from the phone</text>
</svg>
